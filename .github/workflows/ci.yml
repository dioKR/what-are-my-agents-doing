# PR과 main 푸시마다 도는 검사. 하나라도 실패하면 PR에 빨간 X가 뜬다.
# 타입 검사 → 단위 테스트(서버 · 도트 데이터) → 화면 빌드 → 실제 브라우저(Chrome)로 화면 검사
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build && npm run build:server
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Keep the failing screen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore

  # 윈도우에서 경로 처리 같은 문제가 없는지: 타입 검사 · 단위 테스트 · 빌드
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build && npm run build:server
