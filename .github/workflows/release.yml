# v로 시작하는 태그(예: v0.1.0)를 올리면 맥·윈도우 설치 파일을 만들어 GitHub Releases에 올린다.
# 서명하지 않은 빌드다 (맥: 확인되지 않은 개발자 경고, 윈도우: SmartScreen 경고가 뜬다).
name: Release desktop app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 릴리스 설명은 CHANGELOG.md 에서 이 버전 부분을 그대로 가져온다
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          printf '\n---\nDownload the app below, or see https://dioKR.github.io/what-are-my-agents-doing/ (it also shows how to open it the first time). From the terminal: `npx wamad`.\n' >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:server
      - name: Build and upload installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
